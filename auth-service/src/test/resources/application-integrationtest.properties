server.port=0

spring.datasource.url=jdbc:h2:mem:esapauthtest;NON_KEYWORDS=VALUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.flyway.enabled=false

spring.jackson.deserialization.fail-on-unknown-properties=true

logging.level.root=WARN

esap.jwt.secret=secret
esap.security.permit-all=/error,/actuator/health,/api/auth/login,/api/auth/registration/clinic,/api/auth/password/reset

# Тесты не поднимают брокер: KafkaTemplate и EventPublisher подменяются
# заглушками в AbstractControllerTest.
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false
