name: esap-mis

# Образы сервисов собираются без Dockerfile:
#   ./gradlew bootBuildImage
# и дальше поднимаются командой docker compose up -d.

x-service-env: &service-env
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWT_SECRET: secret
  CORS_ALLOWED_ORIGINS: http://localhost:3000

services:
  # PostgreSQL: single instance, separate database per service
  esap-db:
    container_name: esap_db
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports: ["15432:5432"]
    volumes:
      - esap-db:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: "no"
    networks:
      - kafka-net

  notifications-db:
    container_name: notifications-db
    image: mongo:6.0.8
    environment:
      MONGO_INITDB_ROOT_USERNAME: user
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: notifications
    ports:
      - "27017:27017"
    volumes:
      - notifications-db:/data/db
    restart: "no"
    networks:
      - kafka-net

  frontend:
    container_name: frontend
    image: esapmis/frontend:v2
    ports: ["80:80"]
    volumes:
      - /app/node_modules
      - ../frontend:/app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    networks:
      - kafka-net

  # Entry point for all external traffic
  api-gateway:
    container_name: api-gateway
    image: esap-mis-api-gateway:latest
    restart: "no"
    ports: ["8000:8000"]
    environment:
      <<: *service-env
      AUTH_SERVICE_URL: http://auth-service:8081
      CLINIC_SERVICE_URL: http://clinic-service:8082
      SCHEDULE_SERVICE_URL: http://schedule-service:8083
      CORE_SERVICE_URL: http://core:8080
    depends_on:
      - auth-service
      - clinic-service
      - schedule-service
      - core
    networks:
      - kafka-net

  auth-service:
    container_name: auth-service
    image: esap-mis-auth-service:latest
    restart: "no"
    ports: ["8081:8081"]
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://esap-db:5432/esap_auth
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - esap-db
    networks:
      - kafka-net

  clinic-service:
    container_name: clinic-service
    image: esap-mis-clinic-service:latest
    restart: "no"
    ports: ["8082:8082"]
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://esap-db:5432/esap_clinic
      DB_USER: postgres
      DB_PASSWORD: postgres
      AUTH_SERVICE_URL: http://auth-service:8081
      SCHEDULE_SERVICE_URL: http://schedule-service:8083
    depends_on:
      - esap-db
    networks:
      - kafka-net

  schedule-service:
    container_name: schedule-service
    image: esap-mis-schedule-service:latest
    restart: "no"
    ports: ["8083:8083"]
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://esap-db:5432/esap_schedule
      DB_USER: postgres
      DB_PASSWORD: postgres
      AUTH_SERVICE_URL: http://auth-service:8081
      CLINIC_SERVICE_URL: http://clinic-service:8082
    depends_on:
      - esap-db
    networks:
      - kafka-net

  core:
    container_name: core
    image: esap-mis-core:latest
    restart: "no"
    ports: ["8080:8080"]
    environment:
      <<: *service-env
      DB_URL: jdbc:postgresql://esap-db:5432/esap_core
      DB_USER: postgres
      DB_PASSWORD: postgres
      API_KEY: api_key
      AUTH_SERVICE_URL: http://auth-service:8081
      CLINIC_SERVICE_URL: http://clinic-service:8082
      SCHEDULE_SERVICE_URL: http://schedule-service:8083
    depends_on:
      - esap-db
    networks:
      - kafka-net

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    restart: "no"
    networks:
      - kafka-net
    ports:
      - "9094:9094"
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_BROKER_ID: "1"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_NODE_ID: "1"
      KAFKA_KRAFT_CLUSTER_ID: "S40B8iVtR0umuTyuM1eLjA"
      KAFKA_ALLOW_PLAINTEXT_LISTENER: "yes"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_LOG4J_ROOT_LOGLEVEL: "INFO"
      KAFKA_DATA_DIRS: "/var/lib/kafka/data"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka:/var/lib/kafka/data

  notification-service:
    container_name: notification-service
    image: esap-mis-notification-service:latest
    restart: "no"
    ports: ["8084:8084"]
    environment:
      MONGO_HOST: notifications-db
      MONGO_PORT: 27017
      MONGO_DB: notifications
      MONGO_USERNAME: user
      MONGO_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      MAIL_USERNAME: esap.mis.clinic@gmail.com
      MAIL_PASSWORD: mail-password
    networks:
      - kafka-net

networks:
  kafka-net:
    name: kafka-net
    driver: bridge

volumes:
  esap-db:
  notifications-db:
  kafka:
