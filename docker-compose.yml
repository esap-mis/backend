#      - kafka-net
#    ports:
#      - "9000:8080"
#    environment:
#      - KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS=kafka:9092
#      - KAFKA_CLUSTERS_0_NAME=kraft
#    depends_on:
#      - "kafka"

  notification-service:
    container_name: notification-service
    build:
      context: ../backend/notification-service
      dockerfile: /Dockerfile
    restart: "no"
    ports: [ "8083:8083" ]
    environment:
      - server.port=8083
      - spring.kafka.bootstrap-servers=kafka:9092
    networks:
      - kafka-net

  ollama:
    volumes:
      - ollama:/root/.ollama
    container_name: ollama
    pull_policy: always
    tty: true
    restart: unless-stopped
    image: ollama/ollama:0.1.34
    ports:
      - ${OLLAMA_WEBAPI_PORT-11434}:11434
    # GPU support
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: ["gpu"]
              count: all
    networks:
      - kafka-net

networks:
  kafka-net:
    name: kafka-net
    driver: bridge

volumes:
  db-data:
  pgadmin-data:
  kafka:
  ollama: