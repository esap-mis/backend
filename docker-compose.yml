name: esap-mis
version: '3.9'

services:
  esap-db:
    container_name: esap_db
    image: postgres:14.7-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=esap
    ports: ["15432:5432"]
    volumes:
      - esap-db:/var/lib/postgresql/data
    restart: "no"
    networks:
      - kafka-net

  notifications-db:
    container_name: notifications_db
    image: postgres:14.7-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=notifications
    ports: [ "25432:5432" ]
    volumes:
      - notifications-db:/var/lib/postgresql/data
    restart: "no"
    networks:
      - kafka-net

  frontend:
    container_name: frontend
    image: esapmis/frontend:v2
    ports: ["80:80"]
    volumes:
      - /app/node_modules
      - ../frontend:/app
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080

  core:
    container_name: core
#    image: esapmis/core:1.0.1
    build:
      context: ../backend/esap-core
      dockerfile: /Dockerfile
    restart: "no"
    ports: ["8080:8080"]
    environment:
      - SERVER_PORT=8080
      - SPRING_DATASOURCE_URL=jdbc:postgresql://esap-db:5432/esap
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      # - SPRING_AI_OLLAMA_BASE_URL=http://ollama:11434
    networks:
      - kafka-net

