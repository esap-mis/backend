server.port=8080
spring.application.name=Esap Core
application.version=1.0.0
application.github=https://github.com/esap-mis

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

spring.jackson.deserialization.fail-on-unknown-properties=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.threads.virtual.enabled=true

#debug
#debug=true
spring.jpa.show-sql=false
spring.jpa.format-sql=false
#logging.level.org.hibernate=DEBUG
logging.level.root=INFO
logging.level.com.baeldung=INFO
#logging.level.org.springframework.boot.autoconfigure=DEBUG
#logging.level.org.springframework.web=DEBUG

spring.mvc.hiddenmethod.filter.enabled=true
spring.graphql.cors.allowed-origins=http://localhost:3000
spring.mvc.dispatch-options-request=true

spring.flyway.baseline-on-migrate=true

jwt_secret=secret

spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
mail.topic.name=${MAIL_TOPIC_NAME:esap.users.mail}
notifications.topic.name=${NOTIFICATIONS_TOPIC_NAME:esap.users.notifications.mobile}

#spring.ai.ollama.base-url=http://localhost:11434
#spring.ai.ollama.chat.options.model=medllama2
#spring.ai.ollama.chat.options.temperature=0.7
#spring.mvc.async.request-timeout=-1
spring.ai.gigachat.auth.bearer.api-key=${API_KEY}
spring.ai.gigachat.auth.scope=GIGACHAT_API_PERS
spring.ai.gigachat.auth.unsafe-ssl=true
spring.ai.gigachat.chat.options.model=GigaChat
spring.ai.gigachat.chat.options.temperature=0.7
spring.ai.chat.memory.repository.jdbc.initialize-schema=never
spring.ai.chat.memory.repository.jdbc.schema=classpath:/resources/db/migration/V8__addChatMemory.sql

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

management.health.livenessState.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-details=always

management.health.readinessState.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
management.endpoint.health.group.readiness.show-details=always