server.port=8080
spring.application.name=ESAP Core
application.title=ESAP AI Core
application.version=2.0.0

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.threads.virtual.enabled=true

spring.mvc.hiddenmethod.filter.enabled=true
spring.mvc.dispatch-options-request=true

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:15432/esap}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

logging.level.root=INFO

esap.jwt.secret=${JWT_SECRET:secret}
esap.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

esap.services.auth=${AUTH_SERVICE_URL:http://localhost:8081}
esap.services.clinic=${CLINIC_SERVICE_URL:http://localhost:8082}
esap.services.schedule=${SCHEDULE_SERVICE_URL:http://localhost:8083}

spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
esap.kafka.topics.welcome-email=${MAIL_TOPIC_NAME:user.registered.welcome-email}
esap.kafka.topics.push-notification=${NOTIFICATIONS_TOPIC_NAME:user.notification.push.requested}
esap.kafka.topics.token-registration=${NOTIFICATIONS_TOKENS_TOPIC_NAME:user.device.token.registered}
esap.kafka.topics.user-profile=${USER_PROFILE_TOPIC_NAME:esap.user.profile}
esap.kafka.topics.appointment-created=${APPOINTMENT_TOPIC_NAME:esap.appointment.created}

spring.ai.gigachat.auth.bearer.api-key=${API_KEY}
spring.ai.gigachat.auth.scope=GIGACHAT_API_PERS
spring.ai.gigachat.auth.unsafe-ssl=true
spring.ai.gigachat.chat.options.model=GigaChat
spring.ai.gigachat.chat.options.temperature=0.7
spring.ai.chat.memory.repository.jdbc.initialize-schema=never
spring.ai.chat.memory.repository.jdbc.schema=classpath:db/migration/V1__addChatMemory.sql

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always
management.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
