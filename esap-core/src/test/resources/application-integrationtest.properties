server.port=8080

spring.datasource.url=jdbc:h2:mem:esaptest;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=esap
spring.datasource.password=esap
spring.jpa.hibernate.ddl-auto=create-drop

spring.jackson.deserialization.fail-on-unknown-properties=true

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mvc.hiddenmethod.filter.enabled=true
spring.graphql.cors.allowed-origins=http://localhost:3000
spring.mvc.dispatch-options-request=true

spring.flyway.baseline-on-migrate=false

jwt_secret=secret

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.enabled=false
spring.kafka.producer.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration