server.port=8082
spring.application.name=Notification Service
application.version=1.0.0
application.github=https://github.com/esap-mis

spring.threads.virtual.enabled=true

#debug
#debug=true
spring.jpa.show-sql=false
spring.jpa.format-sql=false
#logging.level.org.hibernate=DEBUG
logging.level.root=INFO
logging.level.com.baeldung=INFO
#logging.level.org.springframework.boot.autoconfigure=DEBUG
#logging.level.org.springframework.web=DEBUG

spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
mail.topic.name=${MAIL_TOPIC_NAME:esap.users.mail}
notifications.topic.name=${NOTIFICATIONS_TOPIC_NAME:esap.users.notifications.mobile}

#spring.mail.protocol=smtp
#spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

management.health.mail.enabled=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

management.health.livenessState.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-details=always

management.health.readinessState.enabled=true
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.readiness.show-details=always