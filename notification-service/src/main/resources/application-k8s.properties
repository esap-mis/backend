server.port=8082
spring.application.name=Notification Service
application.version=1.0.0
application.github=https://github.com/esap-mis

spring.data.mongodb.host=${MONGO_HOST:localhost}
spring.data.mongodb.port=${MONGO_PORT:27017}
spring.data.mongodb.database=${MONGO_DB:notifications}
spring.data.mongodb.username=${MONGO_USERNAME:user}
spring.data.mongodb.password=${MONGO_PASSWORD:password}
spring.data.mongodb.authentication-database=admin
spring.data.mongodb.connections.max-per-host=${MONGO_MAX_CONNECTIONS:100}
spring.data.mongodb.connect-timeout=${MONGO_CONNECT_TIMEOUT:10000}

spring.jackson.deserialization.fail-on-unknown-properties=true

spring.threads.virtual.enabled=true

#debug
#debug=true
#logging.level.org.hibernate=DEBUG
logging.level.root=INFO
logging.level.com.baeldung=INFO
#logging.level.org.springframework.boot.autoconfigure=DEBUG
#logging.level.org.springframework.web=DEBUG

spring.kafka.admin.auto-create=false
spring.kafka.admin.fail-fast=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
notification.kafka.topic.welcome-email=${MAIL_TOPIC_NAME:user.registered.welcome-email}
notification.kafka.topic.push-notification=${NOTIFICATIONS_TOPIC_NAME:user.notification.push.requested}
notification.kafka.topic.token-registration=${NOTIFICATIONS_TOKENS_TOPIC_NAME:user.device.token.registered}

#spring.mail.protocol=smtp
#spring.mail.properties.mail.smtp.ssl.enable=true
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.ssl.trust=${MAIL_HOST:smtp.gmail.com}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2

management.health.mail.enabled=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

management.health.livenessState.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.show-details=always

management.health.readinessState.enabled=true
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.readiness.show-details=always