apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: default
  labels:
    app: auth-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: docker.io/library/esap-mis-auth-service:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: DB_URL
              valueFrom:
                configMapKeyRef:
                  name: esap-config
                  key: esap_db_url
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: esap-secret
                  key: esap_db_user
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: esap-secret
                  key: esap_db_password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: esap-secret
                  key: jwt_secret
            - name: KAFKA_BOOTSTRAP_SERVERS
              valueFrom:
                configMapKeyRef:
                  name: esap-config
                  key: kafka_bootstrap_servers
            - name: MAIL_TOPIC_NAME
              valueFrom:
                configMapKeyRef:
                  name: esap-config
                  key: mail_topic_name
            - name: NOTIFICATIONS_TOPIC_NAME
              valueFrom:
                configMapKeyRef:
                  name: esap-config
                  key: notifications_topic_name
            - name: NOTIFICATIONS_TOKENS_TOPIC_NAME
              valueFrom:
                configMapKeyRef:
                  name: esap-config
                  key: notifications_tokens_topic_name
            - name: USER_PROFILE_TOPIC_NAME
              valueFrom:
                configMapKeyRef:
                  name: esap-config
                  key: user_profile_topic_name
            - name: APPOINTMENT_TOPIC_NAME
              valueFrom:
                configMapKeyRef:
                  name: esap-config
                  key: appointment_topic_name
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8081
            failureThreshold: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8081
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8081
            periodSeconds: 5
            failureThreshold: 3
      restartPolicy: Always
